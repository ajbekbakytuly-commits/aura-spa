<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Бет табылмады</title>
    <style>
        :root {
            --bg-body: #0a0e11;
            --accent-red: #e63946;
            --accent-glow: rgba(230, 57, 70, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .error-container {
            max-width: 500px;
        }

        .error-code {
            font-size: 120px;
            font-weight: 900;
            color: var(--accent-red);
            line-height: 1;
            text-shadow: 0 0 30px var(--accent-glow);
            font-family: 'Georgia', serif;
        }

        .error-title {
            font-size: 28px;
            margin: 20px 0 10px;
        }

        .error-desc {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .btn-red {
            background: var(--accent-red);
            color: #ffffff;
            padding: 14px 32px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            display: inline-block;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 13px;
        }

        .btn-red:hover {
            background: #ff4d5a;
            box-shadow: 0 0 20px var(--accent-glow);
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Бет табылмады</h1>
        <p class="error-desc">Кешіріңіз, сіз іздеген бет жойылған немесе мекенжайы қате енгізілген.</p>
        <a href="index.html" class="btn-red">Басты бетке оралу</a>
    </div>

</body>
</html>
